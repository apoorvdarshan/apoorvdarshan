name: Deploy star badge worker

on:
  push:
    branches:
      - main
    paths:
      - "star-badge-worker/**"
      - ".github/workflows/deploy-star-badge-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-star-badge-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.149.0 deploy --config star-badge-worker/wrangler.toml
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
