name: brand-triad-badges
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/brand-triad-badges.yml"
permissions:
  contents: write
jobs:
  update-readme-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align tech badges
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("README.md")
          t = p.read_text(encoding="utf-8")
          t2 = t.replace(
              "![TailwindCSS](https://img.shields.io/badge/-TailwindCSS-06B6D4?style=flat-square&logo=tailwindcss&logoColor=white)",
              "![Tailwind CSS](https://img.shields.io/badge/-Tailwind_CSS-06B6D4?style=flat-square&logo=tailwindcss&logoColor=white)",
          )
          t2 = t2.replace(
              "![Cloudflare](https://img.shields.io/badge/-Cloudflare-F38020?style=flat-square&logo=cloudflare&logoColor=white)",
              "![Cloudflare Workers](https://img.shields.io/badge/-Cloudflare_Workers-F38020?style=flat-square&logo=cloudflare&logoColor=white)",
          )
          t2 = t2.replace(
              "![Claude](https://img.shields.io/badge/-Claude-000000?style=flat-square&logo=anthropic&logoColor=white)",
              "![Claude Code](https://img.shields.io/badge/-Claude_Code-000000?style=flat-square&logo=anthropic&logoColor=white)",
          )
          tech = t2.split("## Apps", 1)[0]
          cursor = "![Cursor](https://img.shields.io/badge/-Cursor-000000?style=flat-square&logo=cursor&logoColor=white)\n"
          needle = "![Codex](https://img.shields.io/badge/-Codex-412991?style=flat-square&logo=openai&logoColor=white)\n"
          if "![Cursor]" not in tech and needle in t2:
              t2 = t2.replace(needle, needle + cursor, 1)
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("updated")
          else:
              print("no change")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Align tech badges: Tailwind CSS, Cloudflare Workers, Claude Code; add Cursor"
          git push
