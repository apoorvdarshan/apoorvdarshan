name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node --check star-badge-worker/src/index.js
      - run: node --test star-badge-worker/test/*.test.*js
      - run: python3 scripts/validate-profile.py
  website:
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --require-hashes -r scripts/automation/requirements.txt
      - run: npm run lint
      - run: node --test scripts/automation/*.test.*js
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - run: npm audit --audit-level=moderate
      - run: python -m pip install --require-hashes -r scripts/automation/requirements-security.txt
      - run: pip-audit -r scripts/automation/requirements.txt
      - run: bandit -r scripts/automation -x scripts/automation/test_android_downloads.py,scripts/automation/test_ios_downloads.py,scripts/automation/test_npm_downloads.py,scripts/automation/test_distribution_counts.py,scripts/automation/test_local_resume.py -ll
      - run: npm run build
  resume-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/validate-template.py
        working-directory: resume/template
  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, website, resume-template]
    runs-on: ubuntu-latest
    concurrency:
      group: automatic-profile-refresh
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
