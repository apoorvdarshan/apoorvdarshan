name: Refresh profile and resume

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh_ios_downloads:
        description: Recheck Apple reports even if already checked today
        type: boolean
        default: false
      refresh_npm_downloads:
        description: Recheck npm lifetime counts even if already checked today
        type: boolean
        default: false
      refresh_distribution_counts:
        description: Recheck GitHub release downloads and public Chrome users today
        type: boolean
        default: false
      refresh_android_downloads:
        description: Recheck Google Play reports even if already checked today
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automatic-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROFILE_README_PATH: ${{ github.workspace }}/profile-readme/README.md
      PROFILE_STARS_PATH: ${{ github.workspace }}/profile-readme/profile-automation/contributions.json
      PROFILE_RESUME_PATH: ${{ github.workspace }}/resume-source/Apoorv_Darshan_Resume.tex
      CLOUDFLARE_ACCOUNT_ID: 9e5adbe3da178e02dbb5b3c27ac1c761
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apoorvdarshan/profile
          ref: main
          ssh-key: ${{ secrets.PROFILE_SITE_DEPLOY_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apoorvdarshan/apoorvdarshan
          ref: main
          path: profile-readme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: apoorvdarshan/profile-resume-private
          ref: main
          path: resume-source
          ssh-key: ${{ secrets.RESUME_SOURCE_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install and test updater
        run: |
          npm ci
          python3 -m pip install -r scripts/automation/requirements.txt
          node --test scripts/automation/*.test.mjs
          python3 -m unittest discover -s scripts/automation -p 'test_*.py'
      - name: Read verified GitHub facts and update managed content
        run: node scripts/automation/update-profile.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Authenticate read-only Google Play reporting
        id: play-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fudai-play-publisher-2026
          workload_identity_provider: projects/945540252044/locations/global/workloadIdentityPools/profile-automation/providers/github
          service_account: profile-reporting@fudai-play-publisher-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only
          create_credentials_file: false
          export_environment_variables: false
      - name: Refresh lifetime Android downloads once per day
        id: android-downloads
        continue-on-error: true
        run: python3 scripts/automation/android_downloads.py
        env:
          PLAY_REPORTS_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_REPORTS_IDENTITY: profile-reporting@fudai-play-publisher-2026.iam.gserviceaccount.com
          PLAY_DOWNLOADS_FORCE: ${{ inputs.refresh_android_downloads && 'true' || 'false' }}
      - name: Keep previous Android counts if Google reports are unavailable
        if: steps.android-downloads.outcome == 'failure' || steps.play-auth.outcome == 'failure'
        run: |
          echo '::warning::Google Play reporting failed. Previous verified Android totals are preserved; other updates continue and the next run retries.'
          echo 'Google Play reporting failed; retained the previous Android snapshot.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh lifetime iOS downloads once per day
        id: ios-downloads
        continue-on-error: true
        run: python3 scripts/automation/ios_downloads.py
        env:
          ASC_REPORTS_KEY_ID: ${{ secrets.ASC_REPORTS_KEY_ID }}
          ASC_REPORTS_ISSUER_ID: ${{ secrets.ASC_REPORTS_ISSUER_ID }}
          ASC_REPORTS_PRIVATE_KEY: ${{ secrets.ASC_REPORTS_PRIVATE_KEY }}
          ASC_DOWNLOADS_FORCE: ${{ inputs.refresh_ios_downloads && 'true' || 'false' }}
      - name: Keep previous download counts if Apple reports are unavailable
        if: steps.ios-downloads.outcome == 'failure'
        run: |
          echo '::warning::iOS download check failed. Previous verified counts are preserved; other profile updates continue. The next run will retry.'
          echo 'iOS download check failed; retained previous verified counts. See the download step for details.' >> "$GITHUB_STEP_SUMMARY"
      - name: Combine latest verified mobile downloads
        # A fresh Android count still publishes if Apple is temporarily unavailable, and vice versa.
        run: python3 scripts/automation/mobile_downloads.py
      - name: Refresh lifetime npm downloads once per day
        id: npm-downloads
        continue-on-error: true
        run: python3 scripts/automation/npm_downloads.py
        env:
          NPM_DOWNLOADS_FORCE: ${{ inputs.refresh_npm_downloads && 'true' || 'false' }}
      - name: Keep previous download counts if npm is unavailable
        if: steps.npm-downloads.outcome == 'failure'
        run: |
          echo '::warning::npm download check failed. Previous verified counts are preserved; other profile updates continue. The next run will retry.'
          echo 'npm download check failed; retained previous verified counts. See the npm step for details.' >> "$GITHUB_STEP_SUMMARY"
      - name: Refresh release downloads and Chrome users once per day
        id: distribution-counts
        continue-on-error: true
        run: python3 scripts/automation/distribution_counts.py
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRIBUTION_FORCE: ${{ inputs.refresh_distribution_counts && 'true' || 'false' }}
      - name: Install resume build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          bash scripts/automation/install-tectonic.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-0.17.0-${{ runner.os }}
      - name: Build and validate resume
        run: python3 scripts/automation/build-resume.py
      - name: Sync and build website from this exact README and star snapshot
        run: npm run build
      - name: Prepare commit signing
        env:
          PROFILE_COMMIT_SIGNING_KEY: ${{ secrets.PROFILE_COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PROFILE_COMMIT_SIGNING_KEY" ]]; then
            echo '::warning::Signing key unavailable; updates will continue unsigned.'
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/profile-commit-signing-key"
          printf '%s\n' "$PROFILE_COMMIT_SIGNING_KEY" > "$key"
          if ! ssh-keygen -y -P '' -f "$key" > "$key.pub" 2>/dev/null; then
            echo '::warning::Signing key could not be loaded; updates will continue unsigned.'
            rm -f "$key" "$key.pub"
            exit 0
          fi
          if [[ "$(awk '{print $1, $2}' "$key.pub")" != "$(awk '{print $1, $2}' profile-readme/.github/profile-signing.pub)" ]]; then
            echo '::warning::Signing key does not match the registered public key; updates will continue unsigned.'
            rm -f "$key" "$key.pub"
            exit 0
          fi
          printf 'PROFILE_SIGNING_KEY_FILE=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Commit and push only managed files
        run: |
          set -euo pipefail
          commit_files() {
            local repo="$1" message="$2"
            shift 2
            git -C "$repo" config user.name 'Apoorv Darshan'
            git -C "$repo" config user.email '90602809+apoorvdarshan@users.noreply.github.com'
            git -C "$repo" add -- "$@"
            if ! git -C "$repo" diff --cached --quiet; then
              local signed=false
              local -a args=(
                --author='Apoorv Darshan <90602809+apoorvdarshan@users.noreply.github.com>'
                -m "$message"
                -m 'Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
              )
              if [[ -n "${PROFILE_SIGNING_KEY_FILE:-}" ]]; then
                if git -C "$repo" -c gpg.format=ssh -c user.signingkey="$PROFILE_SIGNING_KEY_FILE" commit -S "${args[@]}"; then
                  signed=true
                else
                  echo "::warning::Commit signing failed in $repo; continuing unsigned."
                fi
              fi
              # A signing failure must not block an otherwise valid refresh.
              if [[ "$signed" != true ]]; then
                git -C "$repo" -c commit.gpgsign=false commit "${args[@]}"
              fi
              git -C "$repo" push origin HEAD:main
            fi
          }
          commit_files profile-readme 'Refresh verified contributions, stars and downloads' README.md profile-automation/contributions.json profile-automation/npm-downloads.json profile-automation/distribution-counts.json
          commit_files resume-source 'Refresh resume and verified download history' Apoorv_Darshan_Resume.tex Apoorv_Darshan_Resume.pdf build.json ios-download-history.json ios-downloads.json android-downloads.json
          commit_files . 'Sync automatic profile and resume refresh' src/profileData.generated.json public/Apoorv_Darshan_Resume.pdf
      - name: Publish verified build to Cloudflare
        # Always deploy a valid build, including a retry after a previous deployment failure.
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      - name: Report incomplete download refresh
        # Publish valid updates first, then expose failures instead of a green fallback run.
        if: ${{ !cancelled() && (steps.play-auth.outcome == 'failure' || steps.android-downloads.outcome == 'failure' || steps.ios-downloads.outcome == 'failure' || steps.npm-downloads.outcome == 'failure' || steps.distribution-counts.outcome == 'failure') }}
        run: |
          echo '::error::Download refresh incomplete. Failed sources retain their last verified counts; the next scheduled run retries. See the earlier steps for the affected source and build/deployment status.'
          echo '## Download refresh needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'At least one download source failed. Its last verified counts were retained. Other valid updates were allowed to continue; see the build and deployment steps for their result. The next scheduled run retries automatically.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/profile-commit-signing-key" "$RUNNER_TEMP/profile-commit-signing-key.pub"
