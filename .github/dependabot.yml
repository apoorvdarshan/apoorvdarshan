version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Every CodeQL step must run the same version, so they update together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      # React refuses to run when react and react-dom versions differ.
      react:
        patterns:
          - "react"
          - "react-dom"
  - package-ecosystem: pip
    directory: /website/scripts/automation
    schedule:
      interval: weekly
